name: CI Pipeline

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: test-lib
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: test-lib
          toolchains: x86_64-zephyr-elf

      - name: Build
        working-directory: test-lib
        shell: bash
        run: |
          west build -b native_sim test

      - name: Run
        working-directory: test-lib
        shell: bash
        timeout-minutes: 1
        run: |
          ./build/zephyr/zephyr.exe -stop_at=0

      - name: Install
        shell: bash
        run: |
          cmake --install test-lib/build/ --component test_lib --prefix staging
          find staging/ -type f

      - uses: actions/upload-artifact@v4
        with:
          name: test-lib-dist
          path: |
            staging/bin
            staging/include

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: test_env
    steps:
      - uses: actions/checkout@v4
        with:
          repository: adigie/test-bin
          path: test-bin
          token: ${{ secrets.TEST_BIN_PR_PAT }}

      - uses: actions/download-artifact@v4
        with:
          name: test-lib-dist
          path: staging
          run: ls -R staging

      - name: Sync vendored lib and headers
        run: |
          rsync -a --delete staging/bin/ test-bin/bin/
          rsync -a --delete staging/include/ test-bin/include/

      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.TEST_BIN_PR_PAT }}
          path: test-bin
          commit-message: "sync test-lib/#${{ github.event.pull_request.number }}"
          branch: sync/test-lib-pr-${{ github.event.pull_request.number }}
          delete-branch: true
          title: Sync test-lib (test-lib PR \#${{ github.event.pull_request.number }})
          body: |
            Automated sync for [test-lib PR #${{ github.event.pull_request.number }}](https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}).
